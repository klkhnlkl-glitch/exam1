<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار المحاضرات الثلاث</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10221f;
    --card: #143028;
    --gold: #e8b95f;
    --gold-dim: #a9863f;
    --ink: #eef4ee;
    --ink-dim: #9fb6ac;
    --good: #7fbf7f;
    --bad: #d97a6c;
    --line: rgba(232,185,95,0.18);
    --c1: #7fb0bf;
    --c2: #c99fe0;
    --c3: #e8b95f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(232,185,95,0.08), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(127,191,127,0.06), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .wrap{width:100%;max-width:680px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.12em;
    color:var(--gold-dim);
    font-size:12px;
    text-transform:uppercase;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    direction:ltr;
  }
  h1{font-size:clamp(26px,5vw,36px);font-weight:900;margin:0 0 6px;line-height:1.15;}
  .sub{color:var(--ink-dim);font-size:14px;margin-bottom:18px;}
  .legend{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .legend span{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-dim);
    display:flex;align-items:center;gap:6px;
  }
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .timer-badge{
    display:none;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--gold);
    background:rgba(232,185,95,0.08);
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:10px;
    margin-bottom:18px;
    width:fit-content;
    transition:color .3s, border-color .3s, background .3s;
  }
  .timer-badge.low{color:var(--bad);border-color:rgba(217,122,108,0.4);background:rgba(217,122,108,0.1);}
  .track{height:4px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;margin-bottom:26px;}
  .track-fill{height:100%;background:linear-gradient(90deg, var(--gold-dim), var(--gold));width:0%;transition:width .4s cubic-bezier(.6,.2,.2,1);}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:30px 26px;
    position:relative;
    overflow:hidden;
    box-shadow:0 30px 60px -30px rgba(0,0,0,0.6);
  }
  .tagrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qnum{font-family:'IBM Plex Mono', monospace;color:var(--gold);font-size:13px;letter-spacing:.08em;}
  .sec-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    padding:4px 10px;
    border-radius:20px;
    border:1px solid;
  }
  .qtext{font-size:clamp(18px,3vw,22px);font-weight:700;line-height:1.55;margin-bottom:24px;}
  .qtext code{
    background:rgba(255,255,255,0.06);
    padding:1px 7px;
    border-radius:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82em;
    direction:ltr;
    display:inline-block;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    text-align:right;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.09);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    font-size:15.5px;
    padding:13px 16px;
    border-radius:12px;
    cursor:pointer;
    transition:border-color .2s, background .2s;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .opt code{direction:ltr;display:inline-block;font-family:'IBM Plex Mono', monospace;}
  .opt:hover:not(:disabled){border-color:var(--gold-dim);background:rgba(232,185,95,0.06);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--good);background:rgba(127,191,127,0.12);color:var(--good);}
  .opt.wrong{border-color:var(--bad);background:rgba(217,122,108,0.12);color:var(--bad);}
  .opt.selected{border-color:var(--gold);background:rgba(232,185,95,0.1);color:var(--gold);}
  .mark{font-family:'IBM Plex Mono', monospace;font-size:13px;}
  .feedback{margin-top:16px;font-size:13.5px;color:var(--ink-dim);line-height:1.7;min-height:18px;}
  .nav{display:flex;justify-content:flex-end;margin-top:22px;}
  .next-btn{
    font-family:'Tajawal', sans-serif;font-weight:700;font-size:15px;
    background:var(--gold);color:#12241f;border:none;
    padding:12px 26px;border-radius:10px;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .3s, transform .15s;
  }
  .next-btn.show{opacity:1;pointer-events:auto;}
  .next-btn:hover{transform:translateY(-1px);}
  .result{text-align:center;}
  .result .score{
    font-family:'IBM Plex Mono', monospace;
    font-size:clamp(46px,11vw,64px);font-weight:700;color:var(--gold);line-height:1;margin:10px 0 4px;
  }
  .result .score span{font-size:24px;color:var(--ink-dim);}
  .result-msg{font-size:16px;color:var(--ink-dim);margin:14px 0 22px;line-height:1.7;}
  .breakdown{
    display:flex;flex-direction:column;gap:10px;margin:0 0 24px;text-align:right;
  }
  .bd-row{display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono', monospace;font-size:12.5px;color:var(--ink-dim);}
  .bd-label{flex:0 0 150px;text-align:right;color:var(--ink);}
  .bd-bar-bg{flex:1;height:8px;background:rgba(255,255,255,0.07);border-radius:6px;overflow:hidden;}
  .bd-bar-fill{height:100%;border-radius:6px;}
  .bd-val{flex:0 0 44px;text-align:left;}
  .restart{
    font-family:'Tajawal', sans-serif;font-weight:700;background:transparent;
    border:1px solid var(--gold-dim);color:var(--gold);padding:12px 26px;border-radius:10px;
    cursor:pointer;font-size:15px;transition:background .2s;
  }
  .restart:hover{background:rgba(232,185,95,0.08);}
  .fade-in{animation:fadeIn .4s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

  /* --- registration form --- */
  .reg h2{font-size:20px;margin:0 0 6px;}
  .reg-sub{color:var(--ink-dim);font-size:13.5px;margin:0 0 22px;line-height:1.7;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--ink-dim);margin-bottom:7px;font-family:'IBM Plex Mono', monospace;}
  .field input{
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.12);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    font-size:15px;
    padding:12px 14px;
    border-radius:10px;
    outline:none;
    transition:border-color .2s, background .2s;
  }
  .field input:focus{border-color:var(--gold);background:rgba(232,185,95,0.06);}
  .reg-error{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px;}
  .full-btn{width:100%;justify-content:center;}

  /* --- result actions / whatsapp --- */
  .result-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
  .wa-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:'Tajawal', sans-serif;font-weight:700;font-size:14.5px;
    background:#1f5c45;color:#eafff2;border:1px solid rgba(127,191,127,0.4);
    padding:12px 20px;border-radius:10px;cursor:pointer;text-decoration:none;
    transition:transform .15s, background .2s;
  }
  .wa-btn:hover{transform:translateY(-1px);background:#246b50;}
  .review-toggle{
    font-family:'IBM Plex Mono', monospace;font-size:12.5px;color:var(--gold-dim);
    background:transparent;border:1px dashed var(--line);border-radius:10px;
    padding:10px 16px;cursor:pointer;width:100%;margin-bottom:16px;
  }
  .review-toggle:hover{color:var(--gold);border-color:var(--gold-dim);}
  .review-list{
    display:none;
    flex-direction:column;
    gap:12px;
    text-align:right;
    max-height:420px;
    overflow-y:auto;
    margin-bottom:22px;
    padding-left:6px;
  }
  .review-list.show{display:flex;}
  .rv-item{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    padding:14px 16px;
  }
  .rv-q{font-size:13.5px;font-weight:700;margin-bottom:8px;line-height:1.6;}
  .rv-line{font-size:12.5px;line-height:1.8;color:var(--ink-dim);}
  .rv-line b{color:var(--ink);font-weight:500;}
  .rv-line.ok b{color:var(--good);}
  .rv-line.bad b{color:var(--bad);}

  /* --- footer watermark --- */
  .watermark{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.08em;
    color:rgba(159,182,172,0.35);
    margin-top:22px;
    user-select:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow"><span>QUIZ · 50</span><span id="eyebrow-r"></span></div>
  <h1>اختبار المحاضرات الثلاث</h1>
  <p class="sub">أساسيات الكمبيوتر · مقدمة في البرمجة · مقدمة في Python — 50 سؤالًا.</p>
  <div class="legend">
    <span><span class="dot" style="background:var(--c1)"></span>المحاضرة 1: أساسيات الكمبيوتر</span>
    <span><span class="dot" style="background:var(--c2)"></span>المحاضرة 2: مقدمة في البرمجة</span>
    <span><span class="dot" style="background:var(--c3)"></span>المحاضرة 3: مقدمة في Python</span>
  </div>
  <div class="timer-badge" id="timerBadge">⏱ <span id="timerText">30:00</span></div>
  <div class="track"><div class="track-fill" id="trackFill"></div></div>
  <div class="card" id="card"></div>
  <div class="watermark">Eng. Mohamed Ashraf</div>
</div>

<script>
const SEC = {
  1: { name: "أساسيات الكمبيوتر", color: "var(--c1)" },
  2: { name: "مقدمة في البرمجة", color: "var(--c2)" },
  3: { name: "مقدمة في Python", color: "var(--c3)" }
};

const questions = [
// ===== المحاضرة 1: أساسيات الكمبيوتر =====
{s:1,q:"ما هي المراحل الثلاث التي يمر بها الكمبيوتر عند تنفيذ أي عملية؟",o:["الإدخال، المعالجة، الإخراج","الكتابة، الحفظ، الطباعة","التشغيل، التحميل، الإغلاق","البحث، الفرز، العرض"],c:0,n:"الكمبيوتر يستقبل البيانات (Input)، يعالجها (Processing)، ثم يعرض النتائج (Output)."},
{s:1,q:"عند جمع الرقمين 7 و2، ما الذي يمثله استقبال الكمبيوتر للرقمين؟",o:["Output","Processing","Input","Storage"],c:2,n:"استقبال الأرقام من المستخدم هو مرحلة الإدخال (Input)."},
{s:1,q:"ماذا يمثل الرمز 1 في النظام الثنائي؟",o:["عدم وجود تيار كهربي","وجود تيار كهربي","خطأ في النظام","نص فارغ"],c:1,n:"الرمز 1 يرمز لوجود تيار كهربي (ON)، بينما 0 يرمز لعدمه (OFF)."},
{s:1,q:"كل الصور والفيديوهات والأكواد تتحول في النهاية إلى:",o:["حروف عربية","سلسلة من الأصفار والوحدات","ألوان فقط","رموز صوتية"],c:1,n:"الحاسوب يفهم في النهاية فقط لغة النظام الثنائي: 0 و1."},
{s:1,q:"ما وظيفة الـ Compiler أو الـ Interpreter؟",o:["تصميم الشاشات","ترجمة الكود المكتوب بلغة برمجة إلى 0 و1","طباعة المستندات","تخزين الصور فقط"],c:1,n:"هو البرنامج الوسيط الذي يترجم الكود المكتوب بلغة مفهومة مثل Python إلى لغة يفهمها الحاسوب."},
{s:1,q:"أي مما يلي يُعد مثالًا على Hardware؟",o:["Word","لوحة المفاتيح","Excel","نظام التشغيل"],c:1,n:"الـ Hardware هو أي جزء مادي يمكن لمسه، مثل لوحة المفاتيح والشاشة والفأرة."},
{s:1,q:"أي مما يلي يُعد مثالًا على Software؟",o:["السماعات","الطابعة","Word","الفأرة"],c:2,n:"الـ Software هو البرامج التي تعمل على الجهاز، مثل Word وExcel."},
{s:1,q:"القاعدة السريعة لتذكر الفرق بين Hardware وSoftware هي:",o:["Hardware = أي حاجة تقدر تمسكها، Software = أي حاجة تفتحها وتشتغل عليها","كلاهما نفس الشيء","Hardware للبرامج فقط","Software للأجهزة المادية فقط"],c:0,n:"Hardware هو الجزء المادي الملموس، وSoftware هو البرامج التي تُفتح ويُعمل عليها."},
{s:1,q:"أجهزة الإدخال (Input Devices) هي:",o:["الأجهزة التي تعرض النتائج","الأجهزة التي تُدخل البيانات إلى الكمبيوتر","الأجهزة التي تخزن الصور فقط","برامج التصميم"],c:1,n:"مثل الكيبورد والفأرة، تُستخدم لإدخال البيانات إلى الحاسوب."},
{s:1,q:"أجهزة الإخراج (Output Devices) هي:",o:["الأجهزة التي تُدخل البيانات","الأجهزة التي تعرض النتائج للمستخدم","الأجهزة التي تشحن البطارية","لوحات المفاتيح فقط"],c:1,n:"مثل الشاشة والطابعة والسماعات، تُستخدم لعرض النتائج."},
{s:1,q:"ما اسم القواعد التي يجب الالتزام بها عند كتابة كود بلغة برمجة معينة؟",o:["Syntax","Hardware","Loop","Compiler"],c:0,n:"Syntax هي قواعد كتابة الكود الخاصة بكل لغة برمجة."},
{s:1,q:"لغة Python بالنسبة لحالة الأحرف (Case Sensitivity) تعتبر:",o:["name و Name نفس المتغير","name و Name متغيرين مختلفين تمامًا","غير مهم كتابة الحروف كبيرة أو صغيرة","تتجاهل الفرق بين الحروف"],c:1,n:"Python تفرّق بين الحروف الكبيرة والصغيرة، فـ name تختلف عن Name."},
{s:1,q:"ما نوع الخطأ الذي يظهر في هذا الكود؟\n<code>print(\"Hello\"</code>",o:["Name Error","Type Error","Syntax Error","Indentation Error"],c:2,n:"نسيان إغلاق القوس يخالف قواعد كتابة اللغة، وهو ما يسبب Syntax Error."},
{s:1,q:"متى يحدث Name Error في Python؟",o:["عند نسيان القوس","عند استخدام متغير لم يتم تعريفه","عند جمع نص برقم","عند كتابة تعليق"],c:1,n:"إذا استخدمت متغيرًا غير معرَّف مثل print(age) دون تعريف age، يظهر Name Error."},
{s:1,q:"أي كود من التالي يسبب Indentation Error؟",o:["if True:\n    print(\"Hello\")","if True:\nprint(\"Hello\")","print(\"Hello\")","name = \"Ahmed\""],c:1,n:"Python تعتمد على المسافات البادئة لتنظيم الكود؛ عدم كتابتها بشكل صحيح يسبب Indentation Error."},
{s:1,q:"ما سبب حدوث Type Error في الكود التالي؟\n<code>print(\"10\" + 5)</code>",o:["نسيان القوس","محاولة جمع نص مع رقم مباشرة","استخدام متغير غير معرف","خطأ في المسافات"],c:1,n:"لا يمكن جمع نص (String) مع رقم (Integer) مباشرة في Python."},
{s:1,q:"وفقًا للمحاضرة، ما أول خطوة يجب اتخاذها عند ظهور رسالة خطأ؟",o:["تجاهل الرسالة والاستمرار","حذف الكود بالكامل","قراءة رسالة الخطأ لمعرفة سببها ومكانها","إعادة تشغيل الجهاز"],c:2,n:"رسالة الخطأ ليست عدوًا للمبرمج، بل دليل يساعده على تحديد المشكلة وإصلاحها."},
{s:1,q:"كيف يتم إنشاء متغير في Python؟",o:["باستخدام علامة الجمع +","باستخدام علامة الإسناد =","باستخدام القوسين ()","باستخدام علامة النسبة %"],c:1,n:"الصيغة العامة هي: اسم_المتغير = القيمة، مثل name = \"Ahmed\"."},
{s:1,q:"في الكود التالي، ما اسم المتغير وما قيمته؟\n<code>age = 18</code>",o:["الاسم age، القيمة 18","الاسم 18، القيمة age","لا يوجد متغير","الاسم age، لا توجد قيمة"],c:0,n:"age هو اسم المتغير، و18 هي القيمة المخزنة بداخله."},
{s:1,q:"هل يمكن تغيير قيمة متغير بعد إنشائه في Python؟",o:["لا، القيمة ثابتة دائمًا","نعم، يمكن تغييرها في أي وقت","فقط في حالة الأرقام","فقط في حالة النصوص"],c:1,n:"يمكن تغيير قيمة المتغير في أي وقت أثناء تشغيل البرنامج، فتستبدل القيمة الجديدة القديمة."},
{s:1,q:"أي مما يلي اسم متغير صحيح في Python؟",o:["1name","student name","student_name","if"],c:2,n:"يجب أن يبدأ اسم المتغير بحرف أو _، دون مسافات، ودون استخدام كلمات محجوزة مثل if."},
{s:1,q:"لماذا يُعد \"if\" اسمًا خاطئًا لمتغير في Python؟",o:["لأنه طويل جدًا","لأنه كلمة محجوزة في اللغة","لأنه يحتوي على أرقام","لأنه غير مسموح بحروف صغيرة"],c:1,n:"if من الكلمات المحجوزة في Python (مثل else، for، while) ولا يجوز استخدامها كاسم متغير."},
// ===== المحاضرة 2: مقدمة في البرمجة =====
{s:2,q:"ما تعريف البرمجة؟",o:["تصميم الشاشات فقط","كتابة أوامر وتعليمات بلغة يفهمها الكمبيوتر لتنفيذ مهمة أو حل مشكلة","توصيل الأجهزة ببعضها","طباعة المستندات"],c:1,n:"البرمجة هي عملية كتابة أوامر وتعليمات بلغة يفهمها الكمبيوتر لينفذ مهمة معينة."},
{s:2,q:"ما هي الخوارزمية (Algorithm)؟",o:["برنامج جاهز للتحميل","سلسلة من الخطوات المنطقية والمتسلسلة لحل مشكلة معينة","لغة برمجة حديثة","جهاز إلكتروني"],c:1,n:"الخوارزمية هي مجموعة خطوات منظمة ومرتبة تؤدي إلى حل المشكلة."},
{s:2,q:"في مثال تحضير كوب الشاي، ماذا يحدث لو تم تبديل ترتيب الخطوات؟",o:["لا شيء يتغير","تفشل العملية لأن الترتيب أساس نجاح الخوارزمية","يصبح الشاي ألذ","تزيد سرعة التحضير"],c:1,n:"ترتيب الخطوات هو أساس نجاح أي خوارزمية، وتبديله يؤدي إلى فشل تنفيذها بشكل صحيح."},

const TEACHER_NUMBERS = ["201020614529", "201158668841"];
const QUIZ_SECONDS = 30 * 60;

let current = 0;
let score = 0;
let secScore = {1:0, 2:0, 3:0};
let secTotal = {1:0, 2:0, 3:0};
questions.forEach(q => secTotal[q.s]++);

let studentName = "";
let studentCode = "";
let studentPhone = "";
let parentPhone = "";
let userAnswers = new Array(questions.length).fill(null);
let timeLeft = QUIZ_SECONDS;
let timerInterval = null;
let finished = false;

const card = document.getElementById('card');
const trackFill = document.getElementById('trackFill');
const eyebrowR = document.getElementById('eyebrow-r');
const timerBadge = document.getElementById('timerBadge');
const timerText = document.getElementById('timerText');

function renderRegistration(){
  eyebrowR.textContent = 'بيانات الطالب';
  card.innerHTML = `
    <div class="reg">
      <h2>بيانات الطالب</h2>
      <p class="reg-sub">من فضلك اكتب بياناتك قبل بدء الاختبار. مدة الاختبار 30 دقيقة، ولن يتوقف الوقت بعد البدء.</p>
      <div class="field"><label>الاسم بالكامل</label><input type="text" id="regName" placeholder="اكتب اسمك هنا"></div>
      <div class="field"><label>الكود</label><input type="text" id="regCode" placeholder="اكتب الكود الخاص بك"></div>
      <div class="field"><label>رقم هاتفك</label><input type="tel" id="regPhone" placeholder="01xxxxxxxxx"></div>
      <div class="field"><label>رقم هاتف ولي الأمر</label><input type="tel" id="regParent" placeholder="01xxxxxxxxx"></div>
      <div class="reg-error" id="regError"></div>
      <button class="next-btn show full-btn" id="startBtn">ابدأ الاختبار</button>
    </div>
  `;
  card.classList.remove('fade-in');
  void card.offsetWidth;
  card.classList.add('fade-in');

  document.getElementById('startBtn').addEventListener('click', () => {
    const nameVal = document.getElementById('regName').value.trim();
    const codeVal = document.getElementById('regCode').value.trim();
    const phoneVal = document.getElementById('regPhone').value.trim();
    const parentVal = document.getElementById('regParent').value.trim();
    const errEl = document.getElementById('regError');
    if (!nameVal || !codeVal || !phoneVal || !parentVal){
      errEl.textContent = 'من فضلك املأ كل الحقول قبل البدء.';
      return;
    }
    if (phoneVal.replace(/\D/g,'').length < 8 || parentVal.replace(/\D/g,'').length < 8){
      errEl.textContent = 'من فضلك تأكد من كتابة رقم هاتف صحيح.';
      return;
    }
    studentName = nameVal;
    studentCode = codeVal;
    studentPhone = phoneVal;
    parentPhone = parentVal;
    startTimer();
    renderQuestion();
  });
}

function startTimer(){
  timeLeft = QUIZ_SECONDS;
  timerBadge.style.display = 'flex';
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0){
      clearInterval(timerInterval);
      forceFinish();
    }
  }, 1000);
}

function updateTimerDisplay(){
  const m = Math.floor(Math.max(timeLeft,0) / 60);
  const s = Math.max(timeLeft,0) % 60;
  timerText.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  timerBadge.classList.toggle('low', timeLeft <= 60);
}

function forceFinish(){
  if (finished) return;
  renderResult();
}

function updateTrack(){
  const pct = (current / questions.length) * 100;
  trackFill.style.width = pct + '%';
  eyebrowR.textContent = 'سؤال ' + Math.min(current+1, questions.length) + ' / ' + questions.length;
}

function renderQuestion(){
  updateTrack();
  const item = questions[current];
  const sec = SEC[item.s];
  card.innerHTML = `
    <div class="tagrow">
      <span class="qnum">السؤال ${String(current+1).padStart(2,'0')}</span>
      <span class="sec-badge" style="color:${sec.color};border-color:${sec.color};">${sec.name}</span>
    </div>
    <div class="qtext">${item.q.replace(/\n/g,'<br>')}</div>
    <div class="options" id="options"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">${current === questions.length - 1 ? 'عرض النتيجة' : 'التالي'}</button></div>
  `;
  card.classList.remove('fade-in');
  void card.offsetWidth;
  card.classList.add('fade-in');

  const optionsEl = document.getElementById('options');
  const nextBtn = document.getElementById('nextBtn');

  item.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span>${opt}</span><span class="mark"></span>`;
    btn.addEventListener('click', () => {
      const allOpts = optionsEl.querySelectorAll('.opt');
      allOpts.forEach(b => { b.disabled = true; b.classList.remove('selected'); });
      userAnswers[current] = i;
      btn.classList.add('selected');
      btn.querySelector('.mark').textContent = '✓';
      if (i === item.c){
        score++;
        secScore[item.s]++;
      }
      nextBtn.classList.add('show');
    });
    optionsEl.appendChild(btn);
  });

  nextBtn.addEventListener('click', () => {
    current++;
    if (current < questions.length){
      renderQuestion();
    } else {
      renderResult();
    }
  });
}

function buildReviewHTML(){
  let html = '';
  questions.forEach((item, idx) => {
    const ua = userAnswers[idx];
    const answered = ua !== null;
    const correctText = item.o[item.c];
    const userText = answered ? item.o[ua] : 'لم تتم الإجابة';
    const lineClass = answered && ua === item.c ? 'ok' : 'bad';
    html += `
      <div class="rv-item">
        <div class="rv-q">${String(idx+1).padStart(2,'0')}. ${item.q.replace(/\n/g,' ').replace(/<code>|<\/code>/g,'')}</div>
        <div class="rv-line ${lineClass}">إجابتك: <b>${userText}</b></div>
        <div class="rv-line ok">الإجابة الصحيحة: <b>${correctText}</b></div>
      </div>`;
  });
  return html;
}

function buildWhatsAppMessage(){
  const pct = Math.round((score / questions.length) * 100);
  const usedSeconds = QUIZ_SECONDS - Math.max(timeLeft,0);
  const usedM = Math.floor(usedSeconds/60);
  const usedS = usedSeconds%60;
  let msg = `نتيجة اختبار المحاضرات الثلاث\n`;
  msg += `الاسم: ${studentName}\n`;
  msg += `الكود: ${studentCode}\n`;
  msg += `رقم الطالب: ${studentPhone}\n`;
  msg += `رقم ولي الأمر: ${parentPhone}\n`;
  msg += `النتيجة: ${score} / ${questions.length} (${pct}%)\n`;
  msg += `المحاضرة 1: ${secScore[1]}/${secTotal[1]}\n`;
  msg += `المحاضرة 2: ${secScore[2]}/${secTotal[2]}\n`;
  msg += `المحاضرة 3: ${secScore[3]}/${secTotal[3]}\n`;
  msg += `الوقت المستغرق: ${String(usedM).padStart(2,'0')}:${String(usedS).padStart(2,'0')}`;
  return msg;
}

function renderResult(){
  finished = true;
  clearInterval(timerInterval);
  timerBadge.style.display = 'none';
  trackFill.style.width = '100%';
  eyebrowR.textContent = 'النتيجة النهائية';
  const pct = Math.round((score / questions.length) * 100);
  let msg;
  if (pct >= 90) msg = 'إتقان ممتاز لمحتوى المحاضرات الثلاث.';
  else if (pct >= 70) msg = 'مستوى جيد جدًا، راجع النقاط التي أخطأت فيها لتثبيتها.';
  else if (pct >= 50) msg = 'أساس جيد، يُنصح بمراجعة المحاضرات مرة أخرى.';
  else msg = 'يحتاج الموضوع مراجعة كاملة — لا بأس، حاول مرة أخرى.';

  let breakdownHTML = '';
  [1,2,3].forEach(s => {
    const secPct = Math.round((secScore[s] / secTotal[s]) * 100);
    breakdownHTML += `
      <div class="bd-row">
        <span class="bd-label">${SEC[s].name}</span>
        <span class="bd-bar-bg"><span class="bd-bar-fill" style="width:${secPct}%;background:${SEC[s].color};"></span></span>
        <span class="bd-val">${secScore[s]}/${secTotal[s]}</span>
      </div>`;
  });

  const waMessage = encodeURIComponent(buildWhatsAppMessage());
  const waLinks = TEACHER_NUMBERS.map((num, i) =>
    `<a class="wa-btn" href="https://wa.me/${num}?text=${waMessage}" target="_blank" rel="noopener">📤 إرسال النتيجة للمعلم${TEACHER_NUMBERS.length > 1 ? ' ' + (i+1) : ''}</a>`
  ).join('');

  card.innerHTML = `
    <div class="result">
      <span class="qnum" style="display:block;text-align:center;">النتيجة</span>
      <div class="score">${score}<span>/${questions.length}</span></div>
      <p class="result-msg">${msg}</p>
      <div class="breakdown">${breakdownHTML}</div>
      <div class="result-actions">${waLinks}</div>
      <button class="review-toggle" id="reviewToggle">عرض التصحيح الكامل (${questions.length} سؤال)</button>
      <div class="review-list" id="reviewList">${buildReviewHTML()}</div>
      <button class="restart" id="restartBtn">إعادة المحاولة</button>
    </div>
  `;
  card.classList.remove('fade-in');
  void card.offsetWidth;
  card.classList.add('fade-in');

  document.getElementById('reviewToggle').addEventListener('click', () => {
    const list = document.getElementById('reviewList');
    const btn = document.getElementById('reviewToggle');
    const willShow = !list.classList.contains('show');
    list.classList.toggle('show');
    btn.textContent = willShow ? 'إخفاء التصحيح' : `عرض التصحيح الكامل (${questions.length} سؤال)`;
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    current = 0;
    score = 0;
    secScore = {1:0,2:0,3:0};
    userAnswers = new Array(questions.length).fill(null);
    finished = false;
    renderRegistration();
  });
}

renderRegistration();
</script>
</body>
</html>
